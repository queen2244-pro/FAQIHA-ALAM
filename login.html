<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VORT3X | Enter 🔑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root{--accent:#ffb7c5;--glass:rgba(255,255,255,0.08)}body{font-family:'Quicksand',sans-serif;margin:0;color:#fff;background:url('https://vortexhostingfree.ct.ws//uploads/1772646155.jpg') no-repeat center center fixed;background-size:cover;display:flex;justify-content:center;align-items:center;min-height:100vh}.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(13,13,21,0.9);z-index:-1}.card{background:var(--glass);backdrop-filter:blur(25px);padding:40px;border-radius:35px;border:1px solid rgba(255,183,197,0.3);width:90%;max-width:400px;text-align:center;box-shadow:0 15px 35px rgba(0,0,0,0.5)}h1{font-family:'Orbitron',sans-serif;color:var(--accent);letter-spacing:3px;margin-bottom:30px}input{width:100%;padding:12px;margin:10px 0;border-radius:15px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;text-align:center;box-sizing:border-box}.btn{background:var(--accent);color:#111;border:none;padding:12px;border-radius:50px;cursor:pointer;font-weight:700;width:100%;margin-top:15px;transition:0.3s}.btn:hover{box-shadow:0 0 15px var(--accent)}a{color:var(--accent);text-decoration:none;font-size:12px}
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="card">
    <h1>VORT3X</h1>
    <p style="font-size:12px; opacity:0.7;">Identify yourself.</p>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="pass" placeholder="Secret Key">
    <button class="btn" onclick="login()">Enter Vortex</button>
    <p style="font-size:12px; margin-top:20px;">New Soul? <a href="signup.html">Create Access</a></p>
</div>
<script>
    const firebaseConfig = { apiKey: "AIzaSyBXRegELSEewlBwfofK4sr2Kr9ZmM1ipp0", projectId: "fiza-queen" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function login() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        try {
            await auth.signInWithEmailAndPassword(e, p);
            window.location.href = "index.html";
        } catch (err) { alert(err.message); }
    }
</script>
</body>
</html>
