<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQIHA ALAM | 2026 👑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root{--accent:#ffb7c5;--glass:rgba(255,255,255,0.08)}
        body{font-family:'Quicksand',sans-serif;margin:0;color:#fff;background:url('https://vortexhostingfree.ct.ws//uploads/1772646155.jpg') no-repeat center center fixed;background-size:cover;min-height:100vh;display:flex;justify-content:center;align-items:center}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(13,13,21,0.96);z-index:-1}
        .container{width:100%;max-width:800px;text-align:center;padding:20px;display:none;}
        h1{font-family:'Orbitron',sans-serif;color:var(--accent);letter-spacing:5px;text-transform:uppercase;text-shadow:0 0 20px rgba(255,183,197,0.6)}
        .glass-card{background:var(--glass);backdrop-filter:blur(25px);padding:25px;border-radius:35px;border:1px solid rgba(255,183,197,0.3);margin-bottom:25px}
        .btn{background:var(--accent);color:#111;border:none;padding:12px 25px;border-radius:50px;cursor:pointer;font-weight:700;width:100%;margin-top:10px;transition:0.3s}
        .btn:hover{transform:scale(1.02);box-shadow:0 0 20px var(--accent)}
        .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;margin-top:20px}
        .media-card{background:var(--glass);border-radius:15px;overflow:hidden;aspect-ratio:1/1;border:1px solid rgba(255,255,255,0.1)}
        .media-card img,.media-card video{width:100%;height:100%;object-fit:cover}
        #loading{color:var(--accent);font-family:'Orbitron',sans-serif;letter-spacing:2px;text-align:center}
        input[type="file"]{width:100%;padding:10px;margin:10px 0;background:rgba(0,0,0,0.4);color:white;border-radius:10px;border:1px solid rgba(255,255,255,0.1)}
    </style>
</head>
<body oncontextmenu="return false;">
<div class="overlay"></div>
<div id="loading">SCANNING ACCESS...</div>

<div class="container" id="mainApp">
    <h1>FAQIHA ALAM</h1>
    
    <!-- Admin Controls -->
    <div id="adminView" style="display:none;" class="glass-card">
        <h3 style="color:var(--accent);margin-top:0;">Admin Console 👑</h3>
        <input type="file" id="fileInput" accept="image/*,video/*">
        <button class="btn" onclick="uploadMedia()" id="upBtn">Upload Memory</button>
        <div id="status" style="font-size:12px;margin-top:10px;color:var(--accent);"></div>
    </div>

    <!-- User Gallery -->
    <div id="userView">
        <div class="gallery-grid" id="grid"></div>
        <button class="btn" style="width:auto;margin-top:30px;background:transparent;color:white;border:1px solid white;" onclick="firebase.auth().signOut()">Logout</button>
    </div>
</div>

<script>
// Firebase Config (Same as before)
const firebaseConfig = { 
    apiKey: "AIzaSyBXRegELSEewlBwfofK4sr2Kr9ZmM1ipp0", 
    projectId: "fiza-queen", 
    databaseURL: "https://fiza-queen-default-rtdb.firebaseio.com" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "login.html";
    } else {
        db.collection("users").doc(user.uid).get().then(doc => {
            if (doc.exists) {
                const data = doc.data();
                if (data.isApproved || data.role === 'admin') {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    if(data.role === 'admin') document.getElementById('adminView').style.display = 'block';
                    loadGallery();
                } else {
                    document.getElementById('loading').innerHTML = "ACCESS DENIED<br><span style='font-size:12px;font-family:Quicksand;'>Waiting for Admin Approval...</span>";
                }
            } else {
                document.getElementById('loading').innerHTML = "SYSTEM ERROR<br><span style='font-size:12px;'>User record not found.</span>";
            }
        });
    }
});

function loadGallery() {
    db.collection("gallery").orderBy("time", "desc").onSnapshot(sn => {
        const g = document.getElementById('grid');
        g.innerHTML = "";
        sn.forEach(d => {
            const data = d.data();
            const card = document.createElement('div');
            card.className = 'media-card';
            card.innerHTML = data.type === 'video' ? `<video src="${data.url}" controls></video>` : `<img src="${data.url}" onclick="window.open('${data.url}')">`;
            g.appendChild(card);
        });
    });
}

async function uploadMedia() {
    const f = document.getElementById('fileInput').files[0];
    const s = document.getElementById('status');
    const b = document.getElementById('upBtn');
    if(!f) return alert("Select a file!");
    
    b.disabled = true;
    s.innerText = "🌀 Syncing with Cloud...";
    
    const fd = new FormData();
    fd.append("file", f);
    fd.append("upload_preset", "VortEx");
    const r = f.type.startsWith("video") ? "video" : "image";
    
    try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/dawtxacmr/${r}/upload`, {method:"POST", body:fd});
        const d = await res.json();
        if(d.secure_url) {
            await db.collection("gallery").add({
                url: d.secure_url, 
                type: r, 
                time: firebase.firestore.FieldValue.serverTimestamp()
            });
            s.innerText = "✅ Successfully Added!";
            document.getElementById('fileInput').value = "";
        }
    } catch(e) { s.innerText = "❌ Upload Failed"; }
    finally { b.disabled = false; }
}

// Right Click and Inspect Disable
document.onkeydown = function(e) {
    if(e.keyCode == 123 || (e.ctrlKey && (e.shiftKey && e.keyCode == 73)) || (e.ctrlKey && e.keyCode == 85)) return false;
};
</script>
</body>
</html>
