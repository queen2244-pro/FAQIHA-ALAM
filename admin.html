<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Faqiha Alam 👑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Quicksand', sans-serif; background: #0d0d15; color: white; padding: 40px; text-align: center; }
        .admin-card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid #ffb7c5; max-width: 500px; margin: 20px auto; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; }
        button { background: #ffb7c5; font-weight: bold; cursor: pointer; }
        .user-row { display: flex; justify-content: space-between; background: rgba(255,255,255,0.1); padding: 10px; margin-top: 5px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Master Control 👑</h1>

    <div class="admin-card">
        <h3>Upload Media</h3>
        <input type="file" id="fileInput">
        <button onclick="uploadMedia()" id="upBtn">Upload to Cloud ✨</button>
    </div>

    <div class="admin-card">
        <h3>Pending Approvals</h3>
        <div id="userList">Checking...</div>
    </div>

<script>
const firebaseConfig = { apiKey: "AIzaSyBXRegELSEewlBwfofK4sr2Kr9ZmM1ipp0", projectId: "fiza-queen" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
    if(!user) { window.location.href = "index.html"; }
    else {
        db.collection("users").doc(user.uid).get().then(doc => {
            if(doc.data().role !== 'admin') { alert("Not Admin!"); window.location.href = "index.html"; }
            else { loadUsers(); }
        });
    }
});

async function uploadMedia() {
    const file = document.getElementById('fileInput').files[0];
    if(!file) return alert("Select file!");
    const btn = document.getElementById('upBtn');
    btn.innerText = "Uploading...";
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", "VortEx");
    const type = file.type.startsWith("video") ? "video" : "image";
    const res = await fetch(`https://api.cloudinary.com/v1_1/dawtxacmr/${type}/upload`, { method: "POST", body: fd });
    const data = await res.json();
    await db.collection("gallery").add({ url: data.secure_url, type: type, time: firebase.firestore.FieldValue.serverTimestamp() });
    btn.innerText = "Upload to Cloud ✨";
    alert("Done!");
}

function loadUsers() {
    db.collection("users").where("isApproved", "==", false).onSnapshot(snap => {
        const list = document.getElementById('userList');
        list.innerHTML = "";
        snap.forEach(doc => {
            list.innerHTML += `<div class="user-row"><span>${doc.data().email}</span><button onclick="approve('${doc.id}')" style="width:auto; padding:5px 15px;">Approve</button></div>`;
        });
    });
}
function approve(id) { db.collection("users").doc(id).update({ isApproved: true }); }
</script>
</body>
</html>
